<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HD Picture Maker</title>
<style>
:root{--ink:#3b2700;--gold:#f2b100;--card:rgba(255,255,255,.72);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--ink:#3b2700;--gold:#f2b100;--card:rgba(255,255,255,.72);color-scheme:light}}
:root[data-theme="dark"]{--ink:#3b2700;--card:rgba(255,255,255,.72)}
*{box-sizing:border-box;margin:0}
body{min-height:100%;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#ffd23f;background:radial-gradient(circle at 15% 5%,#fff3a8,transparent 45%),linear-gradient(165deg,#ffe45e,#ffc72c 60%,#ffae00);background-attachment:fixed}
.wrap{max-width:520px;margin:0 auto;padding:22px 16px 40px;display:grid;gap:14px}
h1{font-family:Georgia,serif;font-size:30px;text-align:center;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.sub{text-align:center;font-weight:600;color:#6b4a00;font-size:14px;margin-top:-8px}
.card{background:var(--card);border:1.5px solid #fff;border-radius:20px;padding:14px;box-shadow:0 10px 26px rgba(150,90,0,.22);display:grid;gap:12px}
.drop{display:grid;place-items:center;gap:4px;text-align:center;border:2.5px dashed var(--ink);border-radius:16px;padding:22px 10px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.5)}
.drop small{font-weight:500;opacity:.75;word-break:break-all}
.drop input{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;font-weight:600}
.row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;font-size:14px;font-weight:600}
.row output{background:var(--ink);color:#ffd84d;border-radius:99px;padding:2px 10px;font-size:12px}
input[type=range]{width:100%;accent-color:var(--ink);grid-column:1/-1}
select{font:inherit;padding:8px 9px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);width:100%}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:13px;background:var(--ink);color:#ffd84d;cursor:pointer}
button:disabled{opacity:.45}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btns button{background:#fff;color:var(--ink);border:2px solid var(--ink);padding:11px 4px;font-size:14px}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.7);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.cmp{position:relative;border-radius:14px;overflow:hidden;--p:50%;background:#fff;line-height:0}
.cmp img{width:100%;height:auto;display:block}
.cmp .o{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.cmp .ln{position:absolute;top:0;bottom:0;left:var(--p);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.5)}
.tag{position:absolute;top:8px;background:var(--ink);color:#ffd84d;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;line-height:1.2}
.meta{font-size:13px;font-weight:700;text-align:center}
#msg{text-align:center;font-size:13px;font-weight:700;min-height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:8px 13px;font-size:13px}
.chip.on{background:var(--ink);color:#ffd84d}
.pvbox{position:relative;border-radius:14px;overflow:hidden;background:repeating-conic-gradient(#fff 0 25%,#f3e7b0 0 50%) 0 0/16px 16px;line-height:0;touch-action:none;-webkit-user-select:none;user-select:none}
.pvbox canvas{width:100%;height:auto;display:block}
.hint{font-size:12px;font-weight:700;text-align:center;opacity:.8}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>HD Picture Maker</h1>
  <div class="sub">Make a picture bigger and sharper, then save, download, or copy it</div>
  <div class="card">
    <label class="drop"><span style="font-size:34px">🖼️</span>Choose a picture<small id="fn">JPG, PNG, WebP or HEIC photo</small>
      <input id="file" type="file" accept="image/*"></label>
    <div class="pvbox hide" id="pvbox"><canvas id="pv"></canvas><span class="tag" style="left:8px" id="pvtag">Live preview</span></div>
    <div class="hint hide" id="hint">Hold the picture to see the original</div>
    <div class="chips" id="chips"></div>
    <div id="sliders" style="display:grid;gap:10px"></div>
    <div class="two">
      <label>Make it<select id="tgt"><option value="s2">2× bigger</option><option value="s3">3× bigger</option><option value="s4">4× bigger</option><option value="p1280">HD (1280 px)</option><option value="p1920" selected>Full HD (1920 px)</option><option value="p2560">2K (2560 px)</option><option value="p3840">4K (3840 px)</option></select></label>
      <label>Save as<select id="fmt"><option value="jpg">JPG (smaller)</option><option value="png">PNG (lossless)</option></select></label>
    </div>
    <button id="go" disabled>✨ Make it HD</button>
    <div class="bar hide" id="bar"><i id="fill"></i></div>
  </div>
  <div class="card hide" id="out">
    <div class="cmp" id="cmp"><img id="after" alt="Enhanced picture"><div class="o"><img id="before" alt="Original picture"></div><div class="ln"></div><span class="tag" style="left:8px">Before</span><span class="tag" style="right:8px">After</span></div>
    <input id="sl" type="range" min="0" max="100" value="50" style="width:100%;accent-color:var(--ink)">
    <div class="meta" id="meta"></div>
    <div class="btns"><button id="bSave">💾 Save</button><button id="bDl">⬇️ Download</button><button id="bCopy">📋 Copy</button></div>
  </div>
  <div id="msg"></div>
</div>
<script>
const $=id=>document.getElementById(id),MAXPIX=12e6;
let file=null,srcUrl="",outBlob=null,outUrl="",outCv=null,dl=null,ext="jpg";
(async()=>{try{if(window.claude&&claude.use)dl=await claude.use("downloads")}catch(e){}})();
const say=t=>{$("msg").textContent=t},sleep=ms=>new Promise(r=>setTimeout(r,ms)),prog=x=>{$("fill").style.width=x*100+"%"};
$("sl").oninput=()=>$("cmp").style.setProperty("--p",$("sl").value+"%");
const Z={sh:0,ct:0,sa:0,br:0,wm:0,vg:0,gr:0,sp:0,fd:0};
const LOOKS=[["Auto HD","✨",{sh:80,ct:15,sa:15,br:3}],["Original","🖼️",{}],["Vivid","🌈",{sh:70,ct:25,sa:45,br:5}],["Warm","☀️",{sh:60,ct:10,sa:15,wm:30,br:3}],["Cool","❄️",{sh:60,ct:10,sa:10,wm:-30}],["B&W","⚫",{sh:70,ct:25,gr:1}],["Noir","🎩",{sh:80,ct:45,gr:1,vg:55,br:-5}],["Vintage","📷",{sh:30,ct:-5,sa:-10,sp:.55,fd:.5,vg:35,wm:15}],["Cinematic","🎬",{sh:70,ct:35,sa:-5,wm:-12,vg:45,fd:.15,br:-4}],["Dramatic","⚡",{sh:100,ct:50,sa:20,br:-6,vg:40}],["Sunset","🌇",{sh:60,ct:15,sa:35,wm:42,br:4,vg:20}],["Soft Fade","🌸",{sh:20,ct:-12,sa:5,br:8,fd:.25}]];
const SL=[["sh","Sharpness",0,100],["ct","Contrast",-30,50],["sa","Color",-100,60],["br","Brightness",-50,50],["wm","Warmth",-50,50],["vg","Vignette",0,100]];
let P={...Z},pvBase=null,tm;
SL.forEach(([k,l,mn,mx])=>{const r=document.createElement("div");r.className="row";r.innerHTML=`<span>${l}</span><output id="o_${k}">0</output><input id="r_${k}" type="range" min="${mn}" max="${mx}" value="0">`;$("sliders").appendChild(r);
  $("r_"+k).oninput=e=>{P[k]=+e.target.value;$("o_"+k).textContent=P[k];document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));upd()}});
function setLook(i){P={...Z,...LOOKS[i][2]};SL.forEach(([k])=>{$("r_"+k).value=P[k];$("o_"+k).textContent=P[k]});
  document.querySelectorAll(".chip").forEach((c,j)=>c.classList.toggle("on",j===i));upd()}
LOOKS.forEach((l,i)=>{const b=document.createElement("button");b.className="chip";b.textContent=l[1]+" "+l[0];b.onclick=()=>setLook(i);$("chips").appendChild(b)});
function look(c,p,r){
  const W=c.width,H=c.height,x=c.getContext("2d",{willReadFrequently:true}),id=x.getImageData(0,0,W,H),d=id.data,N=W*H,amt=p.sh/100*1.3,B=[];
  if(amt>0){const tmp=new Uint8Array(N);for(let q=0;q<3;q++){const o=new Uint8Array(N);blurH(d,q,W,H,r,tmp);blurV(tmp,o,W,H,r);B.push(o)}}
  const k=1+p.ct/150,sat=1+p.sa/100,br=p.br*1.5,wm=p.wm*.9,vg=p.vg/100,gr=p.gr,sp=p.sp,fd=p.fd,cx=W/2,cy=H/2,md=Math.hypot(cx,cy);
  for(let y=0;y<H;y++){const dy=(y-cy)*(y-cy);for(let xx=0;xx<W;xx++){const j=y*W+xx,i=j*4;let R=d[i],G=d[i+1],Bb=d[i+2];
    if(amt>0){R+=amt*(R-B[0][j]);G+=amt*(G-B[1][j]);Bb+=amt*(Bb-B[2][j])}
    R+=br;G+=br;Bb+=br;
    if(k!==1){R=(R-128)*k+128;G=(G-128)*k+128;Bb=(Bb-128)*k+128}
    if(sat!==1){const l=.299*R+.587*G+.114*Bb;R=l+(R-l)*sat;G=l+(G-l)*sat;Bb=l+(Bb-l)*sat}
    if(wm){R+=wm;Bb-=wm;G+=wm*.2}
    if(gr){const l=.299*R+.587*G+.114*Bb;R+=(l-R)*gr;G+=(l-G)*gr;Bb+=(l-Bb)*gr}
    if(sp){const a=.393*R+.769*G+.189*Bb,b=.349*R+.686*G+.168*Bb,c2=.272*R+.534*G+.131*Bb;R+=(a-R)*sp;G+=(b-G)*sp;Bb+=(c2-Bb)*sp}
    if(fd){R=R*(1-fd*.25)+fd*45;G=G*(1-fd*.25)+fd*45;Bb=Bb*(1-fd*.25)+fd*45}
    if(vg){const dd=Math.sqrt(dy+(xx-cx)*(xx-cx))/md,f=1-vg*dd*dd*1.1;R*=f;G*=f;Bb*=f}
    d[i]=R;d[i+1]=G;d[i+2]=Bb}}
  x.putImageData(id,0,0)}
function preview(){if(!pvBase)return;const c=$("pv");c.width=pvBase.width;c.height=pvBase.height;c.getContext("2d").drawImage(pvBase,0,0);look(c,P,1);$("pvtag").textContent="Live preview"}
function upd(){clearTimeout(tm);tm=setTimeout(preview,40)}
function showOrig(){if(!pvBase)return;const c=$("pv");c.getContext("2d").drawImage(pvBase,0,0);$("pvtag").textContent="Original"}
const pb=$("pvbox");pb.onpointerdown=showOrig;["pointerup","pointerleave","pointercancel"].forEach(ev=>pb.addEventListener(ev,preview));
$("file").onchange=async e=>{file=e.target.files[0];if(!file)return;$("fn").textContent=file.name;$("go").disabled=true;$("out").classList.add("hide");say("Loading...");
  try{const im=await load(file),[w,h]=dim(im),f=Math.min(1,600/Math.max(w,h));pvBase=cv(Math.round(w*f),Math.round(h*f));const x=pvBase.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(im,0,0,pvBase.width,pvBase.height);
    $("pvbox").classList.remove("hide");$("hint").classList.remove("hide");preview();$("go").disabled=false;say("")}
  catch(err){say("Could not open that picture.")}};
setLook(0);
function load(f){return createImageBitmap(f,{imageOrientation:"from-image"}).catch(()=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)}))}
const dim=i=>[i.width||i.naturalWidth,i.height||i.naturalHeight];
function cv(w,h){const c=document.createElement("canvas");c.width=w;c.height=h;return c}
function blurH(d,off,W,H,r,dst){const n=2*r+1;for(let y=0;y<H;y++){const b=y*W;let s=0;for(let i=-r;i<=r;i++)s+=d[(b+Math.min(W-1,Math.max(0,i)))*4+off];
  for(let x=0;x<W;x++){dst[b+x]=(s/n+.5)|0;s+=d[(b+Math.min(W-1,x+r+1))*4+off]-d[(b+Math.max(0,x-r))*4+off]}}}
function blurV(src,dst,W,H,r){const n=2*r+1,s=new Int32Array(W);
  for(let i=-r;i<=r;i++){const b=Math.min(H-1,Math.max(0,i))*W;for(let x=0;x<W;x++)s[x]+=src[b+x]}
  for(let y=0;y<H;y++){const b=y*W;for(let x=0;x<W;x++)dst[b+x]=(s[x]/n+.5)|0;
    const a=Math.min(H-1,y+r+1)*W,m=Math.max(0,y-r)*W;for(let x=0;x<W;x++)s[x]+=src[a+x]-src[m+x]}}
$("go").onclick=async()=>{
  $("go").disabled=true;$("bar").classList.remove("hide");$("out").classList.add("hide");prog(.05);say("Loading picture...");
  try{
    const im=await load(file),[sw,sh]=dim(im),t=$("tgt").value;let s=t[0]==="s"?+t.slice(1):+t.slice(1)/Math.max(sw,sh),note="";
    if(s<1){s=1;note=" The picture was already bigger than that, so it was only sharpened."}
    let tw=Math.round(sw*s),th=Math.round(sh*s);
    if(tw*th>MAXPIX){const f=Math.sqrt(MAXPIX/(tw*th));tw=Math.round(tw*f);th=Math.round(th*f);s=tw/sw;note=" Limited to about 12 megapixels so your phone can handle it."}
    say("Enlarging...");await sleep(20);
    let cur=im,cw=sw,ch=sh;
    while(cw*2<tw){const c=cv(cw*2,ch*2),x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(cur,0,0,cw*2,ch*2);cur=c;cw*=2;ch*=2;await sleep(0)}
    const c=cv(tw,th),x=c.getContext("2d",{willReadFrequently:true});x.imageSmoothingQuality="high";x.drawImage(cur,0,0,tw,th);prog(.3);
    say("Applying the look...");await sleep(20);
    look(c,P,Math.max(1,Math.min(4,Math.round(s*.9))));prog(.8);
    prog(.85);say("Saving...");await sleep(20);
    ext=$("fmt").value;outCv=c;
    outBlob=await new Promise(r=>c.toBlob(r,ext==="png"?"image/png":"image/jpeg",.95));
    if(!outBlob)throw new Error("Could not create the picture. Try a smaller size.");
    if(outUrl)URL.revokeObjectURL(outUrl);if(srcUrl)URL.revokeObjectURL(srcUrl);
    outUrl=URL.createObjectURL(outBlob);srcUrl=URL.createObjectURL(file);
    $("after").src=outUrl;$("before").src=srcUrl;$("cmp").style.setProperty("--p","50%");$("sl").value=50;
    $("meta").textContent=sw+"×"+sh+" → "+tw+"×"+th+" • "+(outBlob.size/1048576).toFixed(2)+" MB";
    $("out").classList.remove("hide");prog(1);say("Done! ✅"+note);$("out").scrollIntoView({behavior:"smooth"});
  }catch(err){say("Something went wrong: "+(err.message||err))}
  $("go").disabled=false;setTimeout(()=>$("bar").classList.add("hide"),600);
};
const name=()=>"hd-picture-"+Date.now()+"."+ext,mime=()=>ext==="png"?"image/png":"image/jpeg";
async function download(){
  if(dl){try{await dl.save({filename:name(),data:outBlob});say("Saved! ✅");return}catch(e){if(e&&e.code==="declined"){say("Download cancelled.");return}}}
  try{const a=document.createElement("a");a.href=outUrl;a.download=name();document.body.appendChild(a);a.click();a.remove();say("Download attempted. If nothing appeared, use Save or long-press the picture.")}catch(e){say("Use Save or long-press the picture.")}}
$("bDl").onclick=()=>outBlob&&download();
$("bSave").onclick=async()=>{if(!outBlob)return;const f=new File([outBlob],name(),{type:mime()});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});say("Shared/saved! ✅");return}}catch(e){if(e&&e.name==="AbortError")return}
  await download()};
$("bCopy").onclick=async()=>{if(!outCv)return;
  try{const png=await new Promise(r=>outCv.toBlob(r,"image/png"));await navigator.clipboard.write([new ClipboardItem({"image/png":png})]);say("Picture copied! 📋")}
  catch(e){say("The browser blocked copying. Use Save or Download, or long-press the picture.")}};
</script>
</body>
</html>
